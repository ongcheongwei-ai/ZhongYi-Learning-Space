<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>乘法星球大冒险</title>
  <meta name="learning-subject" content="数学">
  <meta name="learning-age" content="8岁">
  <meta name="learning-description" content="用星球冒险游戏练习乘法。">
  <meta name="learning-accent" content="#6b4bd8">
  <meta name="learning-favorite" content="true">
  <style>
    :root {
      --bg-a: #28388f;
      --bg-b: #6b4bd8;
      --bg-c: #ff8fb3;
      --paper: #fffaf2;
      --paper-2: #ffffff;
      --ink: #26314f;
      --muted: #65708f;
      --yellow: #ffd45a;
      --orange: #ff9b45;
      --green: #4ecb71;
      --blue: #54b7ff;
      --red: #ff6b7b;
      --purple: #8462ff;
      --shadow: 0 16px 36px rgba(25, 25, 80, 0.22);
      --soft-shadow: 0 8px 20px rgba(35, 31, 80, 0.16);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: "Arial Rounded MT Bold", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 12%, rgba(255, 255, 255, 0.42) 0 2px, transparent 3px),
        radial-gradient(circle at 72% 18%, rgba(255, 255, 255, 0.55) 0 2px, transparent 3px),
        radial-gradient(circle at 88% 50%, rgba(255, 255, 255, 0.4) 0 2px, transparent 3px),
        radial-gradient(circle at 25% 70%, rgba(255, 255, 255, 0.36) 0 2px, transparent 3px),
        linear-gradient(145deg, var(--bg-a) 0%, var(--bg-b) 48%, var(--bg-c) 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    button {
      font: inherit;
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    .app {
      width: min(100%, 480px);
      min-height: 100vh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      position: relative;
    }

    .screen {
      display: none;
      min-height: calc(100vh - 36px);
      animation: pageIn 0.35s ease both;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .icon-button {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--soft-shadow);
      color: var(--ink);
      font-size: 22px;
    }

    .title {
      margin: 8px 0 6px;
      color: #fff;
      text-align: center;
      font-size: clamp(31px, 9vw, 42px);
      line-height: 1.08;
      text-shadow: 0 4px 0 rgba(36, 25, 103, 0.2);
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0 auto 18px;
      max-width: 330px;
      color: rgba(255, 255, 255, 0.92);
      text-align: center;
      font-size: 17px;
      line-height: 1.45;
    }

    .hero-art {
      height: 190px;
      position: relative;
      margin: 8px 0 16px;
    }

    .planet {
      position: absolute;
      left: 22px;
      bottom: 18px;
      width: 128px;
      height: 128px;
      border-radius: 50%;
      background:
        linear-gradient(25deg, transparent 42%, rgba(255, 255, 255, 0.32) 43% 48%, transparent 49%),
        linear-gradient(160deg, #70e0b2, #54b7ff 62%, #7760ff);
      box-shadow: inset -12px -16px 0 rgba(38, 49, 79, 0.12), var(--shadow);
    }

    .planet::after {
      content: "";
      position: absolute;
      left: -18px;
      top: 48px;
      width: 164px;
      height: 30px;
      border: 9px solid rgba(255, 222, 120, 0.85);
      border-left-color: transparent;
      border-right-color: transparent;
      border-radius: 50%;
      transform: rotate(-13deg);
    }

    .rocket {
      position: absolute;
      right: 24px;
      top: 8px;
      width: 112px;
      height: 148px;
      animation: floatRocket 2.7s ease-in-out infinite;
      filter: drop-shadow(0 16px 16px rgba(25, 25, 80, 0.22));
    }

    .rocket-body {
      position: absolute;
      inset: 0 25px 28px;
      border-radius: 55px 55px 30px 30px;
      background: linear-gradient(#fff, #eff7ff);
      overflow: hidden;
    }

    .rocket-body::before {
      content: "";
      display: block;
      width: 100%;
      height: 36px;
      background: var(--red);
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
    }

    .window {
      position: absolute;
      top: 50px;
      left: 50%;
      width: 32px;
      height: 32px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #8de8ff;
      border: 6px solid #4f64c8;
    }

    .fin {
      position: absolute;
      bottom: 28px;
      width: 34px;
      height: 42px;
      background: var(--purple);
      border-radius: 18px 18px 8px 8px;
    }

    .fin.left {
      left: 12px;
      transform: rotate(-28deg);
    }

    .fin.right {
      right: 12px;
      transform: rotate(28deg);
    }

    .flame {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 34px;
      height: 46px;
      transform: translateX(-50%);
      border-radius: 50% 50% 45% 45%;
      background: linear-gradient(#fff46b, #ff9b45, #ff5d5d);
      animation: flame 0.42s ease-in-out infinite alternate;
    }

    .primary-button,
    .secondary-button,
    .option-button {
      width: 100%;
      min-height: 58px;
      border-radius: 18px;
      box-shadow: var(--soft-shadow);
      font-size: 20px;
      font-weight: 800;
      transition: transform 0.15s ease, filter 0.15s ease, background 0.15s ease;
    }

    .primary-button {
      color: #442904;
      background: linear-gradient(180deg, #ffe177, #ffad43);
      border-bottom: 5px solid #e37c22;
    }

    .secondary-button {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 5px solid rgba(130, 145, 190, 0.35);
    }

    .primary-button:active,
    .secondary-button:active,
    .option-button:active,
    .level-card:active {
      transform: translateY(2px) scale(0.99);
    }

    .section-label {
      margin: 20px 4px 10px;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      text-shadow: 0 2px 0 rgba(36, 25, 103, 0.15);
    }

    .level-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .level-card {
      min-height: 106px;
      border-radius: var(--radius);
      padding: 14px;
      text-align: left;
      background: rgba(255, 250, 242, 0.96);
      box-shadow: var(--soft-shadow);
      display: grid;
      grid-template-columns: 58px 1fr auto;
      align-items: center;
      gap: 12px;
      transition: transform 0.15s ease;
    }

    .level-emoji {
      width: 58px;
      height: 58px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 34px;
      background: #fff1b8;
    }

    .level-info h3 {
      margin: 0 0 5px;
      font-size: 19px;
      line-height: 1.2;
    }

    .level-info p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .difficulty,
    .medal-mark {
      white-space: nowrap;
      font-size: 18px;
    }

    .panel {
      background: rgba(255, 250, 242, 0.97);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .hud-pill {
      min-height: 48px;
      padding: 8px 10px;
      border-radius: 16px;
      background: #f0f6ff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1px;
    }

    .hud-pill span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .hud-pill strong {
      font-size: 17px;
      line-height: 1.15;
    }

    .timer {
      grid-column: span 2;
      min-height: 44px;
      border-radius: 15px;
      background: #fff2cf;
      overflow: hidden;
      position: relative;
      display: none;
    }

    .timer.active {
      display: block;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #68d889, #ffd45a, #ff7a70);
      transition: width 0.35s linear;
    }

    .timer-text {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-weight: 900;
      color: #4a3510;
    }

    .question-card {
      margin: 8px 0 14px;
      min-height: 160px;
      border-radius: 26px;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.65) 0 16px, transparent 17px),
        linear-gradient(145deg, #e8fbff, #fff1bf);
      display: grid;
      place-items: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .question-card::before,
    .question-card::after {
      content: "★";
      position: absolute;
      color: rgba(255, 181, 69, 0.45);
      font-size: 36px;
    }

    .question-card::before {
      left: 18px;
      bottom: 16px;
    }

    .question-card::after {
      right: 22px;
      top: 14px;
      transform: rotate(18deg);
    }

    .question {
      font-size: clamp(42px, 14vw, 68px);
      font-weight: 900;
      line-height: 1;
      color: #252f5d;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .monster-arena {
      margin: 0 0 14px;
      padding: 12px;
      border-radius: 22px;
      background: linear-gradient(180deg, #eaf7ff, #fff8dc);
      box-shadow: inset 0 0 0 2px rgba(84, 183, 255, 0.18);
      position: relative;
      overflow: hidden;
    }

    .monster-status {
      min-height: 28px;
      margin-bottom: 8px;
      color: #38416b;
      text-align: center;
      font-weight: 900;
      font-size: 15px;
    }

    .monster-field {
      min-height: 104px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      align-items: center;
      justify-items: center;
      position: relative;
      z-index: 1;
    }

    .monster {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #b9f08f, #57c977);
      box-shadow: 0 6px 0 rgba(43, 132, 75, 0.22);
      font-size: 25px;
      animation: monsterWiggle 1.9s ease-in-out infinite;
    }

    .monster:nth-child(2n) {
      background: linear-gradient(145deg, #ffd36c, #ff8e65);
      animation-delay: -0.6s;
    }

    .monster:nth-child(3n) {
      background: linear-gradient(145deg, #b4e7ff, #7e8cff);
      animation-delay: -1.1s;
    }

    .monster.hit {
      animation: monsterPop 0.42s ease-out forwards;
    }

    .attack-rocket {
      position: absolute;
      left: 10px;
      bottom: 12px;
      z-index: 3;
      font-size: 34px;
      opacity: 0;
      transform: translate(-40px, 28px) rotate(42deg);
      pointer-events: none;
    }

    .attack-rocket.fly {
      animation: rocketAttack 0.52s ease-in forwards;
    }

    .completion-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(23, 28, 86, 0.55);
      backdrop-filter: blur(4px);
    }

    .completion-overlay.show {
      display: grid;
    }

    .completion-card {
      width: min(92vw, 390px);
      min-height: 260px;
      border-radius: 30px;
      background: linear-gradient(160deg, #fffdf4, #dcf8ff);
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 28px 20px;
      animation: completePop 0.75s cubic-bezier(.2, 1.7, .45, 1) both;
    }

    .completion-card .big {
      font-size: 78px;
      line-height: 1;
      animation: floatRocket 1.3s ease-in-out infinite;
    }

    .completion-card h2 {
      margin: 14px 0 6px;
      color: #26314f;
      font-size: 28px;
      line-height: 1.15;
    }

    .completion-card p {
      margin: 0;
      color: var(--muted);
      font-weight: 900;
      font-size: 17px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .option-button {
      min-height: 68px;
      color: #26314f;
      background: #ffffff;
      border: 3px solid #dfe8ff;
      font-size: 26px;
    }

    .option-button.correct {
      background: #daf8e2;
      border-color: var(--green);
      color: #12652d;
    }

    .option-button.wrong {
      background: #ffe1e5;
      border-color: var(--red);
      color: #a32939;
    }

    .option-button:disabled {
      cursor: default;
    }

    .summary {
      text-align: center;
      padding: 22px 16px;
    }

    .big-medal {
      width: 138px;
      height: 138px;
      margin: 4px auto 12px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 76px;
      background: linear-gradient(145deg, #fff5b8, #ffb84d);
      box-shadow: var(--shadow);
      animation: medalPop 0.7s cubic-bezier(.2, 1.7, .45, 1) both;
    }

    .summary h2 {
      margin: 8px 0 10px;
      font-size: 29px;
    }

    .summary-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 16px 0;
    }

    .stat {
      border-radius: 18px;
      background: #f0f6ff;
      padding: 12px 6px;
    }

    .stat strong {
      display: block;
      font-size: 24px;
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .button-stack {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .tiny-note {
      margin: 8px 0 0;
      color: rgba(255, 255, 255, 0.86);
      text-align: center;
      font-size: 13px;
    }

    .star-burst {
      pointer-events: none;
      position: fixed;
      left: 50%;
      top: 42%;
      width: 14px;
      height: 14px;
      z-index: 20;
    }

    .burst-star {
      position: absolute;
      font-size: 28px;
      animation: burst 0.85s ease-out forwards;
    }

    .shake {
      animation: shake 0.35s ease;
    }

    .hidden {
      display: none !important;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes floatRocket {
      0%,
      100% {
        transform: translateY(0) rotate(4deg);
      }
      50% {
        transform: translateY(-12px) rotate(-2deg);
      }
    }

    @keyframes flame {
      from {
        transform: translateX(-50%) scaleY(0.82);
      }
      to {
        transform: translateX(-50%) scaleY(1.08);
      }
    }

    @keyframes burst {
      from {
        opacity: 1;
        transform: translate(0, 0) scale(0.5) rotate(0deg);
      }
      to {
        opacity: 0;
        transform: translate(var(--x), var(--y)) scale(1.2) rotate(180deg);
      }
    }

    @keyframes shake {
      0%,
      100% {
        transform: translateX(0);
      }
      25% {
        transform: translateX(-7px);
      }
      50% {
        transform: translateX(7px);
      }
      75% {
        transform: translateX(-5px);
      }
    }

    @keyframes medalPop {
      from {
        opacity: 0;
        transform: scale(0.45) rotate(-18deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes monsterWiggle {
      0%,
      100% {
        transform: translateY(0) rotate(-2deg);
      }
      50% {
        transform: translateY(-5px) rotate(3deg);
      }
    }

    @keyframes monsterPop {
      0% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: scale(1.8) rotate(22deg);
      }
    }

    @keyframes rocketAttack {
      0% {
        opacity: 0;
        transform: translate(-40px, 30px) rotate(42deg) scale(0.85);
      }
      20% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        transform: translate(310px, -72px) rotate(42deg) scale(1.15);
      }
    }

    @keyframes completePop {
      from {
        opacity: 0;
        transform: scale(0.58) rotate(-8deg);
      }
      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @media (min-width: 430px) {
      .level-grid.home-preview {
        grid-template-columns: 1fr 1fr;
      }

      .level-grid.home-preview .level-card {
        grid-template-columns: 46px 1fr;
      }

      .level-grid.home-preview .difficulty {
        grid-column: 2;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="homeScreen" class="screen active" aria-labelledby="homeTitle">
      <h1 id="homeTitle" class="title">乘法星球<br />大冒险</h1>
      <p class="subtitle">坐上小火箭，答对乘法题，消灭入侵星球的小怪兽！</p>

      <div class="hero-art" aria-hidden="true">
        <div class="planet"></div>
        <div class="rocket">
          <div class="fin left"></div>
          <div class="fin right"></div>
          <div class="rocket-body">
            <div class="window"></div>
          </div>
          <div class="flame"></div>
        </div>
      </div>

      <button id="quickStartBtn" class="primary-button">🚀 开始游戏</button>

      <div class="section-label">选择关卡</div>
      <div id="homeLevels" class="level-grid home-preview"></div>
      <p class="tiny-note">奖牌会自动保存在这台设备上。</p>
    </section>

    <section id="levelScreen" class="screen" aria-labelledby="levelTitle">
      <div class="topbar">
        <button class="icon-button" data-go="homeScreen" aria-label="返回首页">←</button>
        <div></div>
      </div>
      <h2 id="levelTitle" class="title">选择星球</h2>
      <p class="subtitle">每个星球一开始有 10 只怪兽，答错也没关系，继续发射火箭就能赢。</p>
      <div id="levelList" class="level-grid"></div>
    </section>

    <section id="gameScreen" class="screen" aria-labelledby="gameLevelName">
      <div class="topbar">
        <button class="icon-button" id="backToLevelsBtn" aria-label="返回关卡">←</button>
        <button class="icon-button" id="homeFromGameBtn" aria-label="返回首页">⌂</button>
      </div>

      <div class="panel">
        <div class="hud">
          <div class="hud-pill">
            <span>星球</span>
            <strong id="gameLevelName">新手星球</strong>
          </div>
          <div class="hud-pill">
            <span>进度</span>
            <strong id="progressText">1 / 10</strong>
          </div>
          <div class="hud-pill">
            <span>分数</span>
            <strong id="scoreText">0</strong>
          </div>
          <div class="hud-pill">
            <span>星星</span>
            <strong id="starsText">0 ⭐</strong>
          </div>
          <div id="timerBox" class="timer" aria-live="polite">
            <div id="timerFill" class="timer-fill"></div>
            <div id="timerText" class="timer-text">60 秒</div>
          </div>
        </div>

        <div id="questionCard" class="question-card">
          <div id="questionText" class="question">3 × 4 = ?</div>
        </div>

        <div class="monster-arena" aria-live="polite">
          <div id="monsterStatus" class="monster-status">怪兽剩下 10 只，答对就发射火箭！</div>
          <div id="monsterField" class="monster-field"></div>
          <div id="attackRocket" class="attack-rocket" aria-hidden="true">🚀</div>
        </div>

        <div id="optionsBox" class="options"></div>
      </div>
    </section>

    <section id="resultScreen" class="screen" aria-labelledby="resultTitle">
      <div class="topbar">
        <button class="icon-button" data-go="levelScreen" aria-label="返回关卡">←</button>
        <button class="icon-button" data-go="homeScreen" aria-label="返回首页">⌂</button>
      </div>

      <div class="panel summary">
        <div id="medalIcon" class="big-medal">🥇</div>
        <h2 id="resultTitle">挑战完成！</h2>
        <p id="resultMessage" class="subtitle" style="color: var(--muted); margin-bottom: 6px;"></p>

        <div class="summary-stats">
          <div class="stat">
            <strong id="correctSummary">0</strong>
            <span>答对</span>
          </div>
          <div class="stat">
            <strong id="scoreSummary">0</strong>
            <span>分数</span>
          </div>
          <div class="stat">
            <strong id="starsSummary">0</strong>
            <span>星星</span>
          </div>
        </div>

        <div class="button-stack">
          <button id="playAgainBtn" class="primary-button">再玩一次</button>
          <button id="retryWrongBtn" class="secondary-button">错题重练</button>
          <button id="chooseLevelBtn" class="secondary-button">选择其他关卡</button>
        </div>
      </div>
    </section>
  </main>

  <div id="completionOverlay" class="completion-overlay" aria-hidden="true">
    <div class="completion-card">
      <div class="big">🚀✨</div>
      <h2>怪兽全部消灭！</h2>
      <p>星球安全啦，准备领取奖牌！</p>
    </div>
  </div>

  <script>
    // 关卡资料集中管理，方便后续调整题目范围和难度显示。
    const LEVELS = [
      {
        id: "starter",
        name: "新手星球",
        range: "2、3、4、5 的乘法",
        factors: [2, 3, 4, 5],
        difficulty: "⭐",
        emoji: "🪐",
        boss: false
      },
      {
        id: "brave",
        name: "勇气星球",
        range: "6、7、8、9 的乘法",
        factors: [6, 7, 8, 9],
        difficulty: "⭐⭐",
        emoji: "🌕",
        boss: false
      },
      {
        id: "mixed",
        name: "混合星球",
        range: "2 到 9 的混合乘法",
        factors: [2, 3, 4, 5, 6, 7, 8, 9],
        difficulty: "⭐⭐⭐",
        emoji: "🌈",
        boss: false
      },
      {
        id: "boss",
        name: "Boss 挑战",
        range: "随机 2 到 9，60 秒限时",
        factors: [2, 3, 4, 5, 6, 7, 8, 9],
        difficulty: "⭐⭐⭐⭐",
        emoji: "☄️",
        boss: true
      }
    ];

    const STORAGE_KEY = "multiplicationPlanetAdventure.medals";
    const TOTAL_QUESTIONS = 10;
    const INITIAL_MONSTERS = 10;
    const MAX_MONSTERS = 15;
    const BOSS_SECONDS = 60;

    const state = {
      level: LEVELS[0],
      questions: [],
      currentIndex: 0,
      currentQuestion: null,
      score: 0,
      stars: 0,
      correct: 0,
      streak: 0,
      wrongQuestions: [],
      totalAnswered: 0,
      monsterCount: INITIAL_MONSTERS,
      answered: false,
      retryMode: false,
      timerId: null,
      nextTimerId: null,
      secondsLeft: BOSS_SECONDS,
      finished: false,
      completing: false,
      audioContext: null,
      soundReady: false,
      soundOn: true
    };

    const screens = {
      homeScreen: document.getElementById("homeScreen"),
      levelScreen: document.getElementById("levelScreen"),
      gameScreen: document.getElementById("gameScreen"),
      resultScreen: document.getElementById("resultScreen")
    };

    const homeLevels = document.getElementById("homeLevels");
    const levelList = document.getElementById("levelList");
    const quickStartBtn = document.getElementById("quickStartBtn");
    const gameLevelName = document.getElementById("gameLevelName");
    const progressText = document.getElementById("progressText");
    const scoreText = document.getElementById("scoreText");
    const starsText = document.getElementById("starsText");
    const timerBox = document.getElementById("timerBox");
    const timerFill = document.getElementById("timerFill");
    const timerText = document.getElementById("timerText");
    const questionCard = document.getElementById("questionCard");
    const questionText = document.getElementById("questionText");
    const monsterStatus = document.getElementById("monsterStatus");
    const monsterField = document.getElementById("monsterField");
    const attackRocket = document.getElementById("attackRocket");
    const optionsBox = document.getElementById("optionsBox");
    const backToLevelsBtn = document.getElementById("backToLevelsBtn");
    const homeFromGameBtn = document.getElementById("homeFromGameBtn");
    const medalIcon = document.getElementById("medalIcon");
    const resultTitle = document.getElementById("resultTitle");
    const resultMessage = document.getElementById("resultMessage");
    const correctSummary = document.getElementById("correctSummary");
    const scoreSummary = document.getElementById("scoreSummary");
    const starsSummary = document.getElementById("starsSummary");
    const playAgainBtn = document.getElementById("playAgainBtn");
    const retryWrongBtn = document.getElementById("retryWrongBtn");
    const chooseLevelBtn = document.getElementById("chooseLevelBtn");
    const completionOverlay = document.getElementById("completionOverlay");

    function readMedals() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch (error) {
        return {};
      }
    }

    function saveMedal(levelId, medal) {
      const medals = readMedals();
      const medalRank = { bronze: 1, silver: 2, gold: 3 };
      const oldMedal = medals[levelId];

      if (!oldMedal || medalRank[medal] > medalRank[oldMedal]) {
        medals[levelId] = medal;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(medals));
      }
    }

    function medalEmoji(medal) {
      if (medal === "gold") return "🥇";
      if (medal === "silver") return "🥈";
      if (medal === "bronze") return "🥉";
      return "";
    }

    function medalName(medal) {
      if (medal === "gold") return "金牌";
      if (medal === "silver") return "银牌";
      return "铜牌";
    }

    function showScreen(screenId) {
      Object.values(screens).forEach(screen => screen.classList.remove("active"));
      screens[screenId].classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function createLevelCard(level) {
      const medals = readMedals();
      const card = document.createElement("button");
      card.className = "level-card";
      card.type = "button";
      card.setAttribute("aria-label", `选择${level.name}`);
      card.innerHTML = `
        <div class="level-emoji">${level.emoji}</div>
        <div class="level-info">
          <h3>${level.name}</h3>
          <p>${level.range}</p>
        </div>
        <div>
          <div class="difficulty">${level.difficulty}</div>
          <div class="medal-mark">${medalEmoji(medals[level.id])}</div>
        </div>
      `;
      card.addEventListener("click", () => startGame(level.id));
      return card;
    }

    function renderLevelCards() {
      homeLevels.innerHTML = "";
      levelList.innerHTML = "";
      LEVELS.forEach(level => {
        homeLevels.appendChild(createLevelCard(level));
        levelList.appendChild(createLevelCard(level));
      });
    }

    function randomItem(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function makeQuestion(level) {
      const a = randomItem(level.factors);
      const b = Math.floor(Math.random() * 8) + 2;
      return {
        a,
        b,
        answer: a * b,
        id: `${a}x${b}-${Date.now()}-${Math.random()}`
      };
    }

    function makeQuestionSet(level, count) {
      const questions = [];
      const seen = new Set();

      while (questions.length < count) {
        const question = makeQuestion(level);
        const key = `${question.a}x${question.b}`;
        if (!seen.has(key) || seen.size >= level.factors.length * 8) {
          seen.add(key);
          questions.push(question);
        }
      }

      return questions;
    }

    function makeOptions(answer) {
      const options = new Set([answer]);
      const offsets = [-12, -10, -8, -6, -5, -4, -3, -2, 2, 3, 4, 5, 6, 8, 10, 12];

      while (options.size < 4) {
        const candidate = answer + randomItem(offsets);
        if (candidate > 0 && candidate <= 90) {
          options.add(candidate);
        }
      }

      return shuffle([...options]);
    }

    function resetRound(level, questions, retryMode) {
      stopBossTimer();
      clearNextTimer();
      state.level = level;
      state.questions = questions;
      state.currentIndex = 0;
      state.currentQuestion = null;
      state.score = 0;
      state.stars = 0;
      state.correct = 0;
      state.streak = 0;
      state.wrongQuestions = [];
      state.totalAnswered = 0;
      state.monsterCount = retryMode ? Math.max(1, Math.min(MAX_MONSTERS, questions.length)) : INITIAL_MONSTERS;
      state.answered = false;
      state.retryMode = retryMode;
      state.secondsLeft = BOSS_SECONDS;
      state.finished = false;
      state.completing = false;
      completionOverlay.classList.remove("show");
      completionOverlay.setAttribute("aria-hidden", "true");
    }

    function clearNextTimer() {
      if (state.nextTimerId) {
        clearTimeout(state.nextTimerId);
        state.nextTimerId = null;
      }
    }

    function startGame(levelId) {
      const level = LEVELS.find(item => item.id === levelId) || LEVELS[0];
      resetRound(level, makeQuestionSet(level, TOTAL_QUESTIONS), false);
      showScreen("gameScreen");
      renderQuestion();
      if (level.boss) startBossTimer();
    }

    function startWrongRetry() {
      if (state.wrongQuestions.length === 0) return;
      const retryQuestions = state.wrongQuestions.map(question => ({ ...question, id: `${question.id}-retry` }));
      resetRound(state.level, retryQuestions, true);
      showScreen("gameScreen");
      renderQuestion();
    }

    function renderQuestion() {
      if (state.monsterCount <= 0) {
        triggerCompletion();
        return;
      }

      if (state.currentIndex >= state.questions.length) {
        state.questions.push(makeQuestion(state.level));
      }

      state.answered = false;
      state.currentQuestion = state.questions[state.currentIndex];
      const question = state.currentQuestion;

      gameLevelName.textContent = state.retryMode ? "错题重练" : state.level.name;
      progressText.textContent = `第 ${state.totalAnswered + 1} 题`;
      scoreText.textContent = state.score;
      starsText.textContent = `${state.stars} ⭐`;
      questionText.textContent = `${question.a} × ${question.b} = ?`;
      questionCard.classList.remove("shake");
      optionsBox.innerHTML = "";

      makeOptions(question.answer).forEach(option => {
        const button = document.createElement("button");
        button.className = "option-button";
        button.type = "button";
        button.textContent = option;
        button.addEventListener("click", () => chooseAnswer(option, button));
        optionsBox.appendChild(button);
      });

      renderMonsters();
      updateTimerDisplay();
    }

    function chooseAnswer(choice, button) {
      unlockSound();
      if (state.answered || state.finished) return;

      state.answered = true;
      const question = state.currentQuestion;
      const isCorrect = choice === question.answer;
      const optionButtons = [...optionsBox.querySelectorAll(".option-button")];
      optionButtons.forEach(item => {
        item.disabled = true;
        if (Number(item.textContent) === question.answer) item.classList.add("correct");
      });

      if (isCorrect) {
        state.score += 10;
        state.stars += 1;
        state.correct += 1;
        state.streak += 1;
        button.classList.add("correct");
        showStarBurst();
        animateRocketAttack();
        playCorrectSound();

        if (state.streak === 3) {
          playComboSound();
        }
        if (state.streak === 5) {
          state.stars += 1;
          playComboSound();
        }
        state.monsterCount = Math.max(0, state.monsterCount - 1);
      } else {
        state.streak = 0;
        button.classList.add("wrong");
        state.wrongQuestions.push({ ...question });
        questionCard.classList.add("shake");
        state.monsterCount = Math.min(MAX_MONSTERS, state.monsterCount + 1);
        playWrongSound();
      }

      state.totalAnswered += 1;
      scoreText.textContent = state.score;
      starsText.textContent = `${state.stars} ⭐`;
      renderMonsters(isCorrect);

      if (state.monsterCount === 0) {
        state.nextTimerId = setTimeout(triggerCompletion, 650);
      } else {
        progressText.textContent = `已答 ${state.totalAnswered} 题`;
        state.nextTimerId = setTimeout(goNextQuestion, isCorrect ? 760 : 1050);
      }
    }

    function goNextQuestion() {
      clearNextTimer();
      if (!state.answered || state.finished) return;

      if (state.monsterCount <= 0) {
        triggerCompletion();
        return;
      }

      playClickSound();
      state.currentIndex += 1;
      renderQuestion();
    }

    function startBossTimer() {
      timerBox.classList.add("active");
      updateTimerDisplay();
      state.timerId = setInterval(() => {
        state.secondsLeft -= 1;
        updateTimerDisplay();

        if (state.secondsLeft <= 0) {
          finishGame();
        }
      }, 1000);
    }

    function stopBossTimer() {
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
      timerBox.classList.remove("active");
    }

    function updateTimerDisplay() {
      if (!state.level.boss || state.retryMode) {
        timerBox.classList.remove("active");
        return;
      }

      timerBox.classList.add("active");
      timerText.textContent = `${Math.max(state.secondsLeft, 0)} 秒`;
      timerFill.style.width = `${Math.max(state.secondsLeft, 0) / BOSS_SECONDS * 100}%`;
    }

    function getMedalByCorrect(correct, totalAnswered) {
      if (totalAnswered > TOTAL_QUESTIONS) {
        const accuracy = correct / totalAnswered;
        if (accuracy >= 0.8) return "gold";
        if (accuracy >= 0.5) return "silver";
        return "bronze";
      }

      if (correct >= 8) return "gold";
      if (correct >= 5) return "silver";
      return "bronze";
    }

    function renderMonsters(markHit) {
      monsterField.innerHTML = "";
      for (let i = 0; i < state.monsterCount; i += 1) {
        const monster = document.createElement("div");
        monster.className = "monster";
        monster.textContent = ["👾", "😈", "👽"][i % 3];
        if (markHit && i === state.monsterCount - 1) {
          monster.classList.add("hit");
        }
        monsterField.appendChild(monster);
      }
      updateMonsterStatus();
    }

    function updateMonsterStatus() {
      if (state.monsterCount === 0) {
        monsterStatus.textContent = "怪兽剩下 0 只，星球安全啦！";
        return;
      }

      monsterStatus.textContent = `怪兽剩下 ${state.monsterCount} / ${MAX_MONSTERS} 只，答对发射火箭，答错会多 1 只。`;
    }

    function animateRocketAttack() {
      attackRocket.classList.remove("fly");
      void attackRocket.offsetWidth;
      attackRocket.classList.add("fly");
      setTimeout(() => attackRocket.classList.remove("fly"), 620);
    }

    function triggerCompletion() {
      if (state.completing || state.finished) return;
      state.completing = true;
      clearNextTimer();
      stopBossTimer();
      completionOverlay.classList.add("show");
      completionOverlay.setAttribute("aria-hidden", "false");
      playFinishSound();
      setTimeout(() => {
        completionOverlay.classList.remove("show");
        completionOverlay.setAttribute("aria-hidden", "true");
        finishGame();
      }, 1700);
    }

    function finishGame() {
      if (state.finished) return;
      state.finished = true;
      clearNextTimer();
      stopBossTimer();
      const medal = getMedalByCorrect(state.correct, state.totalAnswered);

      if (!state.retryMode) {
        saveMedal(state.level.id, medal);
      }

      medalIcon.textContent = medalEmoji(medal);
      resultTitle.textContent = state.monsterCount === 0 ? "星球安全啦！" : "挑战完成！";
      resultMessage.textContent = state.monsterCount === 0 ? `你消灭了全部怪兽，获得${medalName(medal)}！` : `你获得了${medalName(medal)}，下次继续消灭怪兽！`;
      correctSummary.textContent = `${state.correct}/${state.totalAnswered}`;
      scoreSummary.textContent = state.score;
      starsSummary.textContent = state.stars;
      retryWrongBtn.disabled = state.wrongQuestions.length === 0;
      retryWrongBtn.textContent = state.wrongQuestions.length === 0 ? "没有错题，太棒了！" : `错题重练（${state.wrongQuestions.length} 题）`;
      retryWrongBtn.classList.toggle("hidden", state.wrongQuestions.length === 0);

      showScreen("resultScreen");
      renderLevelCards();
      if (state.monsterCount !== 0) {
        playFinishSound();
      }
    }

    function unlockSound() {
      if (!state.soundOn || state.soundReady) return;

      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) {
        state.soundOn = false;
        return;
      }

      state.audioContext = state.audioContext || new AudioContext();
      if (state.audioContext.state === "suspended") {
        state.audioContext.resume();
      }
      state.soundReady = true;
    }

    function playTone(frequency, start, duration, type, gainValue) {
      if (!state.soundOn || !state.audioContext) return;

      const audio = state.audioContext;
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      const now = audio.currentTime + start;

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, now);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(gainValue, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      oscillator.connect(gain);
      gain.connect(audio.destination);
      oscillator.start(now);
      oscillator.stop(now + duration + 0.02);
    }

    function playCorrectSound() {
      playTone(523.25, 0, 0.12, "sine", 0.18);
      playTone(659.25, 0.09, 0.14, "sine", 0.16);
      playTone(783.99, 0.19, 0.18, "triangle", 0.14);
    }

    function playWrongSound() {
      playTone(220, 0, 0.14, "sawtooth", 0.08);
      playTone(174.61, 0.12, 0.18, "sawtooth", 0.06);
    }

    function playComboSound() {
      playTone(659.25, 0, 0.09, "triangle", 0.16);
      playTone(880, 0.08, 0.11, "triangle", 0.14);
      playTone(1046.5, 0.17, 0.16, "triangle", 0.12);
    }

    function playFinishSound() {
      playTone(392, 0, 0.12, "sine", 0.15);
      playTone(523.25, 0.12, 0.14, "sine", 0.15);
      playTone(659.25, 0.25, 0.16, "sine", 0.14);
      playTone(1046.5, 0.42, 0.32, "triangle", 0.12);
    }

    function playClickSound() {
      playTone(440, 0, 0.06, "triangle", 0.08);
    }

    function showStarBurst() {
      const burst = document.createElement("div");
      burst.className = "star-burst";
      const points = [
        ["-86px", "-74px"],
        ["74px", "-86px"],
        ["96px", "10px"],
        ["-78px", "42px"],
        ["14px", "90px"],
        ["-16px", "-104px"]
      ];

      points.forEach(([x, y], index) => {
        const star = document.createElement("span");
        star.className = "burst-star";
        star.textContent = index % 2 ? "⭐" : "✨";
        star.style.setProperty("--x", x);
        star.style.setProperty("--y", y);
        burst.appendChild(star);
      });

      document.body.appendChild(burst);
      setTimeout(() => burst.remove(), 900);
    }

    quickStartBtn.addEventListener("click", () => startGame("starter"));
    backToLevelsBtn.addEventListener("click", () => {
      clearNextTimer();
      stopBossTimer();
      showScreen("levelScreen");
    });
    homeFromGameBtn.addEventListener("click", () => {
      clearNextTimer();
      stopBossTimer();
      showScreen("homeScreen");
    });
    playAgainBtn.addEventListener("click", () => startGame(state.level.id));
    retryWrongBtn.addEventListener("click", startWrongRetry);
    chooseLevelBtn.addEventListener("click", () => showScreen("levelScreen"));

    document.querySelectorAll("[data-go]").forEach(button => {
      button.addEventListener("click", () => {
        clearNextTimer();
        stopBossTimer();
        showScreen(button.dataset.go);
      });
    });

    renderLevelCards();
  </script>
</body>
</html>
