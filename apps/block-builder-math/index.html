<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>方块建造师 · 数学版</title>
<meta name="learning-subject" content="数学">
<meta name="learning-age" content="8岁">
<meta name="learning-description" content="像建造方块世界一样完成数学任务，边玩边练习。">
<meta name="learning-accent" content="#5B8731">
<meta name="learning-favorite" content="true">
<style>
  :root{
    --sky1:#7EC8F5; --sky2:#BFE6FF;
    --ink:#3B2F23; --panel:#DEB57C; --panel-d:#B08850;
    --wood:#8B5A2B; --green:#5B8731; --green-d:#3F6120;
    --gold:#FFC53D; --gold-d:#D99C14; --red:#E45B5B;
    --stone-ui:#9E9E9E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  .hanzi{font-family:"Kaiti SC","KaiTi","STKaiti","BiauKai",serif}
  html,body{height:100%;overscroll-behavior:none}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:linear-gradient(var(--sky1), var(--sky2) 70%, #A8D8A0);
    color:var(--ink);
    display:flex;justify-content:center;
  }
  #app{width:100%;max-width:520px;padding:10px 10px 24px;display:flex;flex-direction:column;gap:10px}

  /* ------- header ------- */
  .hud{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .hud h1{font-size:18px;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.25);letter-spacing:1px}
  .hud .stars{background:#fff;border:3px solid var(--gold-d);border-radius:12px;
    padding:4px 10px;font-weight:800;font-size:15px;box-shadow:0 3px 0 var(--gold-d)}

  /* ------- pixel-panel look ------- */
  .panel{
    background:#F5E6C8;border:4px solid var(--panel-d);border-radius:6px;
    box-shadow:inset 0 0 0 3px #FFF3DA, 0 4px 0 rgba(0,0,0,.15);
    padding:10px;
  }

  /* ------- build grid ------- */
  #world{
    display:grid;gap:1px;background:rgba(255,255,255,.25);
    border:4px solid var(--panel-d);border-radius:6px;overflow:hidden;
    touch-action:none;
  }
  .cell{
    aspect-ratio:1/1;background:transparent;position:relative;
  }
  .cell.ghost{outline:2px dashed rgba(255,255,255,.6);outline-offset:-3px}

  /* block textures (pure CSS, blocky) */
  .b{width:100%;height:100%}
  .b-dirt {background:#8B5A2B;box-shadow:inset 3px 3px 0 #A0713D, inset -3px -3px 0 #6E441F}
  .b-grass{background:#8B5A2B;box-shadow:inset 3px 3px 0 #A0713D, inset -3px -3px 0 #6E441F;position:relative}
  .b-grass::before{content:"";position:absolute;left:0;top:0;width:100%;height:38%;
    background:#6DBB45;box-shadow:inset 2px 2px 0 #8FD867, inset -2px -2px 0 #4E9130}
  .b-wood {background:#C89B5F;box-shadow:inset 3px 3px 0 #DDB77E, inset -3px -3px 0 #9A7340;
    background-image:repeating-linear-gradient(0deg, transparent 0 22%, rgba(122,82,48,.5) 22% 26%)}
  .b-stone{background:#8F8F8F;box-shadow:inset 3px 3px 0 #ABABAB, inset -3px -3px 0 #6B6B6B}
  .b-glass{background:rgba(200,240,255,.45);box-shadow:inset 0 0 0 3px rgba(255,255,255,.9)}
  .b-leaf {background:#3E8C2F;box-shadow:inset 3px 3px 0 #55B040, inset -3px -3px 0 #2C6A20}
  .b-wool-red   {background:#D9534F;box-shadow:inset 3px 3px 0 #E8807D, inset -3px -3px 0 #A93531}
  .b-wool-yellow{background:#F3C531;box-shadow:inset 3px 3px 0 #FADf75, inset -3px -3px 0 #C79A12}
  .b-wool-blue  {background:#4A7ED9;box-shadow:inset 3px 3px 0 #7AA3E8, inset -3px -3px 0 #2F5AA8}
  .b-gold {background:#F5CE42;box-shadow:inset 3px 3px 0 #FFE98A, inset -3px -3px 0 #C79A12;
    background-image:radial-gradient(circle at 30% 30%, rgba(255,255,255,.7) 0 12%, transparent 13%)}
  .b-water{background:#4AA3DF;box-shadow:inset 0 -3px 0 #2F7CB8;opacity:.85}
  .b-tnt{background:#C93B2F;box-shadow:inset 3px 3px 0 #E05548, inset -3px -3px 0 #8F2018;position:relative}
  .b-tnt::before{content:"TNT";position:absolute;left:0;top:34%;width:100%;height:32%;
    background:#F2E3C8;color:#C93B2F;font-size:9px;font-weight:900;letter-spacing:1px;
    display:flex;align-items:center;justify-content:center}
  .b-torch{position:relative;background:transparent}
  .b-torch::before{content:"";position:absolute;left:42%;top:40%;width:16%;height:52%;background:#7A5230;
    box-shadow:inset 1px 1px 0 #9A7340}
  .b-torch::after{content:"";position:absolute;left:34%;top:14%;width:32%;height:30%;border-radius:40% 40% 30% 30%;
    background:radial-gradient(circle at 50% 70%, #FFF3A0 0 30%, #FFB13D 60%, #E8622C 100%);
    box-shadow:0 0 12px 4px rgba(255,190,80,.85)}
  .fuse{animation:fuse .18s infinite alternate}
  @keyframes fuse{from{filter:brightness(1)}to{filter:brightness(2.2) saturate(.4)}}
  .boomfx{position:absolute;inset:0;z-index:5;border-radius:2px;pointer-events:none;
    background:radial-gradient(circle, #FFF3A0 0 25%, #FFB13D 55%, rgba(232,98,44,0) 75%);
    animation:boom .45s forwards}
  @keyframes boom{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
  .shade{position:absolute;inset:0;background:#0B1430;pointer-events:none;z-index:4}
  #world.night{border-color:#2A3350}
  body.night{background:linear-gradient(#152040, #253358 70%, #1E3020)}
  body.night .hud h1{text-shadow:2px 2px 0 rgba(0,0,0,.6)}

  /* furniture & sky */
  .b-chair{background:
    linear-gradient(#7A5230,#7A5230) 18% 12%/13% 78% no-repeat,
    linear-gradient(#9A7340,#9A7340) 18% 55%/62% 14% no-repeat,
    linear-gradient(#7A5230,#7A5230) 68% 60%/13% 32% no-repeat}
  .b-bed{background:
    linear-gradient(#F2EFE4,#F2EFE4) 10% 40%/24% 20% no-repeat,
    linear-gradient(#C9403B,#C9403B) 38% 40%/56% 20% no-repeat,
    linear-gradient(#8B5A2B,#8B5A2B) 8% 60%/86% 14% no-repeat,
    linear-gradient(#6E441F,#6E441F) 8% 74%/10% 16% no-repeat,
    linear-gradient(#6E441F,#6E441F) 84% 74%/10% 16% no-repeat}
  .b-tv, .b-tv-on{position:relative;background:
    linear-gradient(#2B2B2B,#2B2B2B) 12% 14%/76% 54% no-repeat,
    linear-gradient(#3B4A5A,#3B4A5A) 18% 21%/64% 40% no-repeat,
    linear-gradient(#2B2B2B,#2B2B2B) 44% 68%/12% 12% no-repeat,
    linear-gradient(#2B2B2B,#2B2B2B) 30% 80%/40% 8% no-repeat}
  .b-tv-on::before{content:"";position:absolute;left:18%;top:21%;width:64%;height:40%;
    background:linear-gradient(45deg,#FF6B6B,#FFC53D,#5B8731,#4A7ED9,#B45BD9);
    background-size:300% 300%;animation:tvplay 1.6s infinite alternate;
    box-shadow:0 0 10px 2px rgba(140,190,255,.8)}
  @keyframes tvplay{from{background-position:0% 0%}to{background-position:100% 100%}}
  .b-sun{position:relative;background:transparent}
  .b-sun::before{content:"";position:absolute;left:18%;top:18%;width:64%;height:64%;border-radius:50%;
    background:radial-gradient(circle at 40% 40%, #FFF6C8 0 35%, #FFD94D 70%, #F5A623 100%);
    box-shadow:0 0 16px 6px rgba(255,214,90,.9)}
  .b-moon{position:relative;background:transparent}
  .b-moon::before{content:"";position:absolute;left:16%;top:14%;width:66%;height:66%;border-radius:50%;
    box-shadow:inset -8px 4px 0 2px #EDE9D8, 0 0 10px 2px rgba(220,225,255,.55)}
  .b-mountain{position:relative;background:transparent}
  .b-mountain::before{content:"";position:absolute;inset:0;
    background:linear-gradient(160deg,#A5A5A5,#6B6B6B);
    clip-path:polygon(50% 4%, 96% 96%, 4% 96%)}
  .b-mountain::after{content:"";position:absolute;inset:0;background:#F4F6F8;
    clip-path:polygon(50% 4%, 67% 38%, 58% 31%, 50% 40%, 42% 30%, 33% 38%)}
  .b-tree{position:relative;background:transparent}
  .b-tree::before{content:"";position:absolute;left:42%;top:52%;width:16%;height:44%;
    background:#7A5230;box-shadow:inset 2px 2px 0 #9A7340}
  .b-tree::after{content:"";position:absolute;left:14%;top:4%;width:72%;height:58%;
    border-radius:50% 50% 46% 46%;
    background:radial-gradient(circle at 35% 30%, #55B040 0 40%, #3E8C2F 75%, #2C6A20 100%)}
  .b-bookshelf{background:
    repeating-linear-gradient(90deg,#C9403B 0 17%,#4A7ED9 17% 33%,#F3C531 33% 51%,#5B8731 51% 68%,#B45BD9 68% 84%,#E8895A 84% 100%) 14% 12%/72% 32% no-repeat,
    repeating-linear-gradient(90deg,#5B8731 0 16%,#F3C531 16% 35%,#B45BD9 35% 50%,#C9403B 50% 69%,#4A7ED9 69% 85%,#F2EFE4 85% 100%) 14% 56%/72% 32% no-repeat,
    linear-gradient(#9A7340,#9A7340);
    box-shadow:inset 3px 3px 0 #B08850, inset -3px -3px 0 #6E441F}
  .b-tvstand{background:
    linear-gradient(#6E441F,#6E441F) 46% 62%/8% 14% no-repeat,
    linear-gradient(#6E441F,#6E441F) 6% 42%/88% 9% no-repeat,
    linear-gradient(#8B5A2B,#8B5A2B) 10% 50%/80% 34% no-repeat,
    linear-gradient(#6E441F,#6E441F) 14% 84%/9% 12% no-repeat,
    linear-gradient(#6E441F,#6E441F) 78% 84%/9% 12% no-repeat}
  .b-sofa{background:
    linear-gradient(#2F5AA8,#2F5AA8) 4% 30%/13% 48% no-repeat,
    linear-gradient(#2F5AA8,#2F5AA8) 83% 30%/13% 48% no-repeat,
    linear-gradient(#6B99E8,#6B99E8) 15% 54%/70% 24% no-repeat,
    linear-gradient(#4A7ED9,#4A7ED9) 15% 24%/70% 32% no-repeat,
    linear-gradient(#6E441F,#6E441F) 12% 82%/9% 14% no-repeat,
    linear-gradient(#6E441F,#6E441F) 79% 82%/9% 14% no-repeat}
  .b-frame{position:relative;background:
    linear-gradient(#7CB342,#7CB342) 20% 56%/60% 24% no-repeat,
    linear-gradient(#AEE1FF,#AEE1FF) 20% 20%/60% 60% no-repeat,
    linear-gradient(#C8860A,#C8860A);
    box-shadow:inset 3px 3px 0 #E0A419, inset -3px -3px 0 #96650A}
  .b-frame::before{content:"";position:absolute;left:56%;top:26%;width:16%;height:16%;
    border-radius:50%;background:#FFD94D}
  .b-stairs{background:linear-gradient(135deg,#DDB77E,#C89B5F 55%,#9A7340);
    clip-path:polygon(0% 100%, 0% 50%, 50% 50%, 50% 0%, 100% 0%, 100% 100%)}
  .b-stairs-flip{background:linear-gradient(225deg,#DDB77E,#C89B5F 55%,#9A7340);
    clip-path:polygon(0% 0%, 50% 0%, 50% 50%, 100% 50%, 100% 100%, 0% 100%)}
  .b-flower{position:relative;background:transparent}
  .b-flower::before{content:"";position:absolute;left:46%;top:42%;width:9%;height:54%;
    background:#3E8C2F;
    box-shadow:-5px 6px 0 -1px #55B040, 5px 10px 0 -1px #55B040}
  .b-flower::after{content:"";position:absolute;left:27%;top:8%;width:46%;height:46%;
    border-radius:50%;
    background:radial-gradient(circle, #F3C531 0 28%, #D9534F 30% 100%);
    box-shadow:0 0 0 2px rgba(169,53,49,.35)}
  .b-tallgrass{position:relative;background:transparent}
  .b-tallgrass::before{content:"";position:absolute;left:10%;right:10%;top:26%;bottom:4%;
    background:linear-gradient(#55B040,#3E8C2F);
    clip-path:polygon(0% 100%, 7% 48%, 16% 100%, 26% 18%, 36% 100%, 50% 0%, 63% 100%, 73% 22%, 83% 100%, 92% 45%, 100% 100%)}

  /* ------- palette ------- */
  .pal-top{display:flex;gap:6px;margin-bottom:8px}
  .tabbtn{flex:1;border:2px solid var(--panel-d);background:#FFF3DA;border-radius:8px;
    padding:7px 2px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;
    color:#7A6347;position:relative}
  .tabbtn.on{background:var(--green);border-color:var(--green-d);color:#fff}
  .tabbtn .dot{position:absolute;top:2px;right:4px;color:var(--gold);font-size:11px}
  .tabbtn.on .dot{color:#FFF3A0}
  .hammerbtn{width:44px;flex:none;border:2px solid var(--panel-d);background:#FFF3DA;
    border-radius:8px;font-size:18px;cursor:pointer}
  .hammerbtn.on{background:var(--green);border-color:var(--green-d)}
  .palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .slot{
    border:3px solid var(--panel-d);border-radius:8px;background:#FFF3DA;
    padding:5px 3px 3px;text-align:center;cursor:pointer;position:relative;
    box-shadow:0 3px 0 var(--panel-d);
  }
  .slot.sel{border-color:var(--green);box-shadow:0 0 0 3px var(--green), 0 3px 0 var(--green-d);background:#EEF7E4}
  .slot .swatch{width:30px;height:30px;margin:0 auto 3px}
  .slot .cnt{font-size:12px;font-weight:800}
  .slot .nm{font-size:10px;color:#7A6347;line-height:1.1}
  .slot.zero .swatch{opacity:.3}
  .slot.zero .cnt{color:var(--red)}
  .slot.tool .swatch{font-size:24px;line-height:30px}

  /* ------- buttons ------- */
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .btn{
    border:none;cursor:pointer;font-weight:800;font-size:15px;font-family:inherit;
    border-radius:8px;padding:11px 16px;color:#fff;
    background:var(--green);box-shadow:0 4px 0 var(--green-d);transition:transform .08s;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
  .btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-d)}
  .btn.gray{background:var(--stone-ui);box-shadow:0 4px 0 #6B6B6B}
  .btn.small{font-size:13px;padding:8px 12px}

  /* ------- modal ------- */
  .overlay{position:fixed;inset:0;background:rgba(30,40,60,.55);display:flex;
    align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal{width:100%;max-width:440px;max-height:88vh;overflow:auto}
  .modal h2{font-size:19px;margin-bottom:8px;color:var(--green-d)}
  .q-text{font-size:19px;line-height:1.7;font-weight:700;margin:8px 0 4px}
  .q-sub{font-size:13px;color:#8A7458;margin-bottom:10px}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .choice{
    border:3px solid var(--panel-d);background:#FFF3DA;border-radius:10px;
    font-size:26px;font-weight:800;padding:14px 0;cursor:pointer;text-align:center;
    box-shadow:0 4px 0 var(--panel-d);font-family:inherit;color:var(--ink);
  }
  .choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--panel-d)}
  .choice.right{background:#5B8731;border-color:#3F6120;color:#fff;box-shadow:0 4px 0 #3F6120;animation:pop .35s}
  .choice.wrong{background:var(--red);border-color:#A93531;color:#fff;animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
  .fb{min-height:24px;text-align:center;font-weight:800;margin-top:10px;font-size:16px}
  .fb.good{color:var(--green-d)} .fb.bad{color:var(--red)}
  .speakq{background:none;border:none;font-size:22px;cursor:pointer;vertical-align:middle}

  .mission{border:3px solid var(--panel-d);border-radius:10px;background:#FFF9EC;
    padding:10px 12px;margin-top:10px}
  .mission .t{font-weight:800;font-size:15px}
  .mission .d{font-size:13px;color:#7A6347;margin:4px 0 8px;line-height:1.5}
  .mission.done{background:#EEF7E4;border-color:var(--green)}
  .mine-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
  .mine-opt{display:flex;align-items:center;gap:10px;border:3px solid var(--panel-d);
    border-radius:10px;background:#FFF3DA;padding:8px 10px;cursor:pointer;box-shadow:0 3px 0 var(--panel-d)}
  .mine-opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--panel-d)}
  .mine-opt .swatch{width:34px;height:34px;flex:none}
  .mine-opt .info{text-align:left}
  .mine-opt .info b{font-size:14px;display:block}
  .mine-opt .info span{font-size:11px;color:#8A7458}
  .center{text-align:center}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <h1>⛏️ 方块建造师</h1>
    <div class="stars">⭐ <span id="starCnt">0</span></div>
  </div>

  <div id="world"></div>

  <div class="panel">
    <div class="pal-top" id="palTop"></div>
    <div class="palette" id="palette"></div>
  </div>

  <div class="row">
    <button class="btn gold" id="mineBtn">⛏️ 挖矿赚方块</button>
    <button class="btn" id="missionBtn">📜 任务书</button>
    <button class="btn gray small" id="nightBtn">🌙 夜晚</button>
    <button class="btn gray small" id="clearBtn">🧹 重新开始</button>
  </div>
  <details style="text-align:center">
    <summary style="font-size:12px;color:#5A7A4A;cursor:pointer;font-weight:700">❓ 怎么玩</summary>
    <p class="center" style="font-size:12px;color:#5A7A4A;margin-top:6px">
      选一种方块点格子放置;点普通方块可拆掉退料,选🔨可以拆任何东西(连TNT都能安全拆走)。<br>
      ⚠️ 点TNT会点燃它!📺 点电视开/关机。📚 点书架抽一本书来读,读完有奖励!🪜 点楼梯换方向。<br>
      🌙 夜晚时:点床睡觉直接到天亮;火把、太阳、月亮会发光。
    </p>
  </details>
</div>

<script>
"use strict";
/* ================= blocks ================= */
const BLOCKS = [
  {id:"dirt", cat:"basic",  nm:"泥土",   cls:"b-dirt",  tier:1, gain:10},
  {id:"wood", cat:"basic",  nm:"木板",   cls:"b-wood",  tier:2, gain:8, craft:{one:"1 个原木", out:"木板", unit:"块"}},
  {id:"stone", cat:"basic", nm:"石头",   cls:"b-stone", tier:3, gain:8},
  {id:"glass", cat:"basic", nm:"玻璃",   cls:"b-glass", tier:4, gain:6},
  {id:"leaf", cat:"basic",  nm:"树叶",   cls:"b-leaf",  tier:2, gain:8, craft:{one:"1 棵树", out:"树叶", unit:"片"}},
  {id:"water", cat:"basic", nm:"水",     cls:"b-water", tier:1, gain:8},
  {id:"torch", cat:"special", nm:"火把",   cls:"b-torch", tier:2, gain:6, craft:{one:"1 个煤炭 + 1 根木棍", out:"火把", unit:"支"}},
  {id:"wool-red", cat:"special",   nm:"红羊毛", cls:"b-wool-red",   tier:4, gain:6},
  {id:"wool-yellow", cat:"special",nm:"黄羊毛", cls:"b-wool-yellow",tier:4, gain:6},
  {id:"wool-blue", cat:"special",  nm:"蓝羊毛", cls:"b-wool-blue",  tier:4, gain:6},
  {id:"gold", cat:"special",  nm:"金块",   cls:"b-gold",  tier:5, gain:5},
  {id:"tnt", cat:"special",   nm:"TNT",    cls:"b-tnt",   tier:5, gain:3},
  {id:"chair", cat:"furni", nm:"椅子",   cls:"b-chair", tier:3, gain:3},
  {id:"tv", cat:"furni",    nm:"电视机", cls:"b-tv",    tier:4, gain:2},
  {id:"bed", cat:"furni",   nm:"床",     cls:"b-bed",   tier:3, gain:2},
  {id:"sun", cat:"nature",   nm:"太阳",   cls:"b-sun",   tier:5, gain:1},
  {id:"moon", cat:"nature",  nm:"月亮",   cls:"b-moon",  tier:5, gain:1},
  {id:"mountain", cat:"nature", nm:"山",  cls:"b-mountain", tier:3, gain:4},
  {id:"tree", cat:"nature",  nm:"树",     cls:"b-tree",  tier:2, gain:6, craft:{one:"1 包树苗", out:"树", unit:"棵", verb:"种出"}},
  {id:"bookshelf", cat:"furni", nm:"书架", cls:"b-bookshelf", tier:4, gain:2},
  {id:"tvstand", cat:"furni", nm:"电视架", cls:"b-tvstand", tier:3, gain:2},
  {id:"sofa", cat:"furni",  nm:"沙发",   cls:"b-sofa",  tier:4, gain:2},
  {id:"frame", cat:"furni", nm:"相框",   cls:"b-frame", tier:1, gain:3},
  {id:"stairs", cat:"furni", nm:"楼梯",  cls:"b-stairs", tier:3, gain:4},
  {id:"flower", cat:"nature", nm:"花",    cls:"b-flower", tier:1, gain:5},
  {id:"tallgrass", cat:"nature", nm:"草", cls:"b-tallgrass", tier:1, gain:6},
];
const TIER_NAME = {1:"简单 · 加减", 2:"合成 · 乘4", 3:"进阶 · 加减", 4:"乘法表", 5:"高手 · 综合"};

/* ================= speech ================= */
function speak(t, rate){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "zh-CN"; u.rate = rate || 0.85;

/* ================= world rendering ================= */
const world = document.getElementById("world");
world.style.gridTemplateColumns = `repeat(${COLS},1fr)`;

/* 画布尺寸:用 JS 直接算格子高度,不依赖 aspect-ratio(部分浏览器不支持) */
function sizeWorld(){
  const w = world.clientWidth - 8;          // 扣掉边框
  const cell = Math.floor((w - (COLS-1)) / COLS);
  world.style.gridAutoRows = cell + "px";
  world.style.minHeight = (cell*ROWS + ROWS-1) + "px";
}
addEventListener("resize", sizeWorld);

function blockCls(id){
  if(id==="grass-floor") return "b-grass";
  if(id==="tv-on") return "b-tv-on";
  if(id==="stairs-flip") return "b-stairs-flip";
  const b = BLOCKS.find(b=>b.id===id);
  return b ? b.cls : "";
}
function renderWorld(){
  world.innerHTML = "";
  world.classList.toggle("night", S.night);
  document.body.classList.toggle("night", S.night);
  // 光源(夜晚照明用):火把、太阳、月亮
  const lights = [];
  if(S.night){
    S.grid.forEach((v,k)=>{
      if(v==="torch"||v==="sun"||v==="moon") lights.push([Math.floor(k/COLS), k%COLS, v]);
    });
  }
  for(let i=0;i<ROWS*COLS;i++){
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.i = i;
    const v = S.grid[i];
    if(v){
      const b = document.createElement("div");
      b.className = "b " + blockCls(v);
      cell.appendChild(b);
    }
    if(S.night){
      const r=Math.floor(i/COLS), c=i%COLS;
      let op=0.74;
      for(const [lr,lc,lt] of lights){
        const d=Math.max(Math.abs(lr-r),Math.abs(lc-c));
        let o;
        if(lt==="sun")       o = d<=3?0    : d===4?0.18 : d<=5?0.38 : 0.74; // 太阳:强光
        else if(lt==="moon") o = d<=1?0.15 : d===2?0.35 : d===3?0.55 : 0.74; // 月亮:柔光
        else                 o = d<=1?0    : d===2?0.28 : d===3?0.52 : 0.74; // 火把
        if(o<op) op=o;
      }
      if(op>0){
        const sh=document.createElement("div");
        sh.className="shade"; sh.style.opacity=op;
        cell.appendChild(sh);
      }
    }
    world.appendChild(cell);
  }
}

/* ================= TNT ================= */
let exploding = false;
function ignite(i){
  if(S.grid[i]!=="tnt") return;
  exploding = true;
  const cell = world.children[i];
  if(cell && cell.firstChild) cell.firstChild.classList.add("fuse");
  setTimeout(()=>explode(i), 800);
}
function explode(i){
  if(S.grid[i]!=="tnt"){ exploding=false; return; }
  const r0=Math.floor(i/COLS), c0=i%COLS;
  const hit=[], chain=[];
  for(let r=r0-1;r<=r0+1;r++)for(let c=c0-1;c<=c0+1;c++){
    if(r<0||r>=ROWS||c<0||c>=COLS) continue;
    const k=r*COLS+c;
    const v=S.grid[k];
    hit.push(k);
    if(k===i){ S.grid[k]=null; continue; }
    if(!v || v==="grass-floor") continue;
    if(v==="tnt") chain.push(k);       // 连锁引爆!
    else S.grid[k]=null;               // 炸掉的方块不退回 — 这就是 TNT!
  }
  saveS(); renderWorld(); renderPalette();
  hit.forEach(k=>{
    const fx=document.createElement("div");
    fx.className="boomfx";
    world.children[k].appendChild(fx);
    setTimeout(()=>fx.remove(), 500);
  });
  if(chain.length){
    chain.forEach((k,j)=>setTimeout(()=>ignite(k), 250*(j+1)));
  }else{
    exploding=false;
  }
}

/* place / remove with pointer drag */
let painting = false;
function baseId(v){
  if(v==="tv-on") return "tv";
  if(v==="stairs-flip") return "stairs";
  return v;
}
function handleCell(el){
  if(!el || !el.dataset.i) return;
  if(exploding) return;                             // 爆炸中先别动
  const i = +el.dataset.i;
  const cur = S.grid[i];
  if(cur === "grass-floor") return;                 // floor is permanent
  if(S.sel === "hammer"){                           // 🔨 拆除模式:什么都能安全拆(包括 TNT)
    if(!cur) return;
    S.grid[i] = null;
    const b = baseId(cur);
    S.inv[b] = (S.inv[b]||0) + 1;
    saveS(); renderWorld(); renderPalette();
    return;
  }
  if(cur === "tnt"){ ignite(i); return; }           // 点 TNT = 点燃!
  if(cur === "bed" && S.night){ sleep(); return; }  // 夜晚点床 = 睡觉到天亮
  if(cur === "tv"){ S.grid[i]="tv-on"; saveS(); renderWorld(); return; }   // 开电视
  if(cur === "tv-on"){ S.grid[i]="tv"; saveS(); renderWorld(); return; }   // 关电视
  if(cur === "bookshelf"){ openBook(); return; }    // 点书架 = 抽一本书来读!
  if(cur === "stairs"){ S.grid[i]="stairs-flip"; saveS(); renderWorld(); return; }  // 换方向 ↰
  if(cur === "stairs-flip"){ S.grid[i]="stairs"; saveS(); renderWorld(); return; }  // 换方向 ↱
  if(cur){                                          // remove -> refund
    S.grid[i] = null;
    const b = baseId(cur);
    S.inv[b] = (S.inv[b]||0) + 1;
  }else{
    if((S.inv[S.sel]||0) <= 0){ flashSlot(S.sel); return; }
    S.inv[S.sel]--;
    S.grid[i] = S.sel;
  }
  saveS(); renderWorld(); renderPalette();
}
function sleep(){
  const ov = openModal(`<h2 class="center">😴 睡觉中……</h2>
    <p class="center" style="font-size:44px;margin:8px 0">🛏️💤</p>`);
  setTimeout(()=>{
    S.night = false;
    saveS(); renderWorld(); syncNightBtn();
    closeModal(ov);
    speak("天亮啦!");
  }, 1200);
}

/* ================= quiz generation ================= */
function ri(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function genQ(tier, blk){
  let text, ans, read;
  if(tier===1){
    if(Math.random()<0.5){ const a=ri(5,15),b=ri(3,9); text=`${a} + ${b} = ?`; ans=a+b; read=`${a} 加 ${b} 等于几?`; }
    else{ const a=ri(10,20),b=ri(2,9); text=`${a} − ${b} = ?`; ans=a-b; read=`${a} 减 ${b} 等于几?`; }
  }else if(tier===2){
    const n=ri(3,9);
    const cr = (blk && blk.craft) || {one:"1 个原木", out:"木板", unit:"块"};
    const vb = cr.verb || "做";
    text=`${cr.one}能${vb} 4 ${cr.unit}${cr.out}。\n${vb} ${n} 次,能得到几${cr.unit}${cr.out}?`; ans=n*4;
    read=`${cr.one}能${vb}四${cr.unit}${cr.out},${vb} ${n} 次,能得到几${cr.unit}${cr.out}?`;
  }else if(tier===3){
    if(Math.random()<0.5){ const a=ri(25,60),b=ri(12,35); text=`${a} + ${b} = ?`; ans=a+b; read=`${a} 加 ${b} 等于几?`; }
    else{ const a=ri(50,99),b=ri(15,40); text=`${a} − ${b} = ?`; ans=a-b; read=`${a} 减 ${b} 等于几?`; }
  }else if(tier===4){
    const t=[2,3,4,5][ri(0,3)], n=ri(2,9);
    text=`${t} × ${n} = ?`; ans=t*n; read=`${t} 乘 ${n} 等于几?`;
  }else{
    if(Math.random()<0.5){
      const L=ri(5,10), W=ri(3,6);
      text=`长方形围墙:长 ${L} 格,宽 ${W} 格。\n绕一圈是多少格?`; ans=(L+W)*2;
      read=`长方形围墙,长 ${L} 格,宽 ${W} 格,绕一圈是多少格?`;
    }else{
      const extra=ri(5,30);
      text=`一组是 64 个。\n1 组再加 ${extra} 个,一共几个?`; ans=64+extra;
      read=`一组是六十四个,一组再加 ${extra} 个,一共几个?`;
    }
  }
  // distractors near the answer
  const set = new Set([ans]);
  while(set.size<4){
    let d = ans + [ -10,-4,-2,-1,1,2,4,10 ][ri(0,7)];
    if(d>0) set.add(d);
  }
  return { text, ans, read, opts: shuffle([...set]) };
}

function openMine(preferId){
  let html = `<h2>⛏️ 挖矿场 — 想要哪种方块?</h2>
    <p style="font-size:13px;color:#7A6347">答对一题,方块进背包。越难的方块,题目越有挑战!</p>

      <div class="info"><b>${b.nm} ×${b.gain}</b><span>${TIER_NAME[b.tier]}</span></div>
    </button>`;
  });
  html += `</div><div class="center" style="margin-top:12px">
    <button class="btn gray small" id="cx">先不挖了</button></div>`;
  const ov = openModal(html);
  ov.querySelector("#cx").onclick = ()=>closeModal(ov);

    closeModal(ov); openQuiz(preferId);

function openQuiz(blockId){
  const b = BLOCKS.find(x=>x.id===blockId);
  const q = genQ(b.tier, b);
  let html = `<h2>⛏️ 挖「${b.nm}」</h2>
    <div class="q-sub">${TIER_NAME[b.tier]} · 答对 +${b.gain} 个 <button class="speakq" id="sp">🔊</button></div>
    <div class="q-text">${q.text.replace(/\n/g,"<br>")}</div>
    <div class="choices">${q.opts.map((o,i)=>`<button class="choice" data-k="${i}">${o}</button>`).join("")}</div>
    <div class="fb" id="fb"></div>
    <div class="center"><button class="btn gray small" id="cx">返回</button></div>`;
  const ov = openModal(html);
  ov.querySelector("#cx").onclick = ()=>closeModal(ov);
  ov.querySelector("#sp").onclick = ()=>speak(q.read);
  let solved=false, tries=0;
  ov.querySelectorAll(".choice").forEach(btn=>{
    btn.onclick = ()=>{
      if(solved) return;
      const v = q.opts[+btn.dataset.k];
      const fb = ov.querySelector("#fb");
      if(v===q.ans){
        solved = true;
        btn.classList.add("right");
        const gain = tries===0 ? b.gain : Math.max(2, Math.ceil(b.gain/2));
        S.inv[b.id]=(S.inv[b.id]||0)+gain;
        fb.textContent = `答对了!${b.nm} +${gain} ✨`;
        fb.className="fb good";
        saveS(); renderPalette();
        setTimeout(()=>{ closeModal(ov); }, 1100);
      }else{
        tries++;
        btn.classList.add("wrong");
        fb.textContent = "再想想,你可以的!";
        fb.className="fb bad";
        setTimeout(()=>btn.classList.remove("wrong"), 450);
      }
    };
  });
}

    const can = n >= m.need;
    html += `<div class="mission ${done?"done":""}">
      <div class="t">${m.t} ${done?"✅":""} <span style="color:var(--gold-d)">${"⭐".repeat(m.star)}</span></div>
      <div class="d">${m.d}</div>
      ${done ? "" : `<button class="btn small ${can?"gold":"gray"}" data-id="${m.id}" ${can?"":"disabled"}>
        ${can ? "爸爸/妈妈验收 ✔" : `还要再放 ${m.need-n} 个方块`}</button>`}
    </div>`;
  });
  html += `<div class="center" style="margin-top:12px"><button class="btn gray small" id="cx">关闭</button></div>`;
  const ov = openModal(html);
  ov.querySelector("#cx").onclick = ()=>closeModal(ov);
  ov.querySelectorAll("button[data-id]").forEach(btn=>{
    btn.onclick = ()=>{
      const m = MISSIONS.find(x=>x.id===btn.dataset.id);
      S.missions[m.id]=true; S.stars+=m.star;
      saveS(); renderPalette();
      speak("任务完成,太棒了!");
      closeModal(ov); openMissions();
    };
  });
}

/* ================= clear ================= */
document.getElementById("clearBtn").onclick = ()=>{
  const ov = openModal(`<h2>🧹 重新开始?</h2>
    <p style="font-size:14px;line-height:1.6">拆掉所有方块,材料全部退回背包。星星和任务记录会保留。</p>
    <div class="center" style="margin-top:12px">
      <button class="btn" id="ok">好,重新建</button>
      <button class="btn gray" id="cx">不要</button></div>`);
  ov.querySelector("#cx").onclick = ()=>closeModal(ov);
  ov.querySelector("#ok").onclick = ()=>{
    S.grid.forEach((v,i)=>{
      if(v && v!=="grass-floor"){ const b=baseId(v); S.inv[b]=(S.inv[b]||0)+1; S.grid[i]=null; }
    });
    saveS(); renderWorld(); renderPalette(); closeModal(ov);
  };
};

document.getElementById("mineBtn").onclick = ()=>openMine();
document.getElementById("missionBtn").onclick = openMissions;
const nightBtn = document.getElementById("nightBtn");
function syncNightBtn(){ nightBtn.textContent = S.night ? "☀️ 白天" : "🌙 夜晚"; }
nightBtn.onclick = ()=>{
  S.night = !S.night;
  saveS(); renderWorld(); syncNightBtn();
};
syncNightBtn();

sizeWorld();
renderWorld();
renderPalette();
</script>
</body>
</html>
