<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff7d6">
    <title>忠毅学习空间</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="回到首页">
          <span class="brand-mark">忠</span>
          <span>
            <strong>忠毅学习空间</strong>
            <small>忠毅的小小练习站</small>
          </span>
        </a>
        <button class="icon-button" id="clearRecentButton" type="button" title="清除最近打开">
          <span aria-hidden="true">↺</span>
          <span class="sr-only">清除最近打开</span>
        </button>
      </header>

      <main>
        <section class="hero" aria-labelledby="pageTitle">
          <div>
            <p class="eyebrow">8 岁学习乐园</p>
            <h1 id="pageTitle">今天要闯哪一关？</h1>
          </div>
          <div class="hero-art" aria-hidden="true">
            <span class="toy-card toy-card-one">×</span>
            <span class="toy-card toy-card-two">ABC</span>
            <span class="toy-card toy-card-three">★</span>
          </div>
          <div class="hero-panel" aria-live="polite">
            <span id="appCount">0</span>
            <small>个小关卡</small>
          </div>
        </section>

        <section class="controls" aria-label="筛选学习 app">
          <label class="search">
            <span class="sr-only">搜索 app</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"></path>
            </svg>
            <input id="searchInput" type="search" placeholder="找一个想玩的练习">
          </label>
          <div class="chips" id="subjectChips" role="list" aria-label="科目"></div>
        </section>

        <section class="section" id="favoritesSection" hidden>
          <div class="section-heading">
            <h2>最爱玩的</h2>
          </div>
          <div class="grid" id="favoritesGrid"></div>
        </section>

        <section class="section" id="recentSection" hidden>
          <div class="section-heading">
            <h2>最近玩过</h2>
          </div>
          <div class="grid compact" id="recentGrid"></div>
        </section>

        <section class="section">
          <div class="section-heading">
            <h2>全部关卡</h2>
            <span id="resultCount"></span>
          </div>
          <div class="grid" id="appsGrid"></div>
          <div class="empty" id="emptyState" hidden>
            <strong>没有找到这个关卡</strong>
            <span>换个关键词，或选择“全部”。</span>
          </div>
        </section>
      </main>
    </div>

    <template id="appCardTemplate">
      <article class="app-card">
        <a class="card-link" href="">
          <span class="app-icon" aria-hidden="true"></span>
          <span class="card-content">
            <span class="card-topline">
              <span class="subject"></span>
              <span class="age"></span>
            </span>
            <strong class="title"></strong>
            <span class="description"></span>
          </span>
          <span class="open-indicator" aria-hidden="true">→</span>
        </a>
      </article>
    </template>

    <script src="app.js" type="module"></script>
  </body>
</html>
